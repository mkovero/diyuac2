[package]
name = "diyuac2"
version = "0.1.0"
edition = "2024"
description = "diyuac2 UAC2 firmware for the i.MX RT1020 (Rust port)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
imxrt-hal = { version = "0.6", features = ["imxrt1020"] }
imxrt-ral = { version = "0.6", features = ["imxrt1021", "rt"] }
imxrt-rt = { version = "0.1", features = ["device"] }
panic-halt = "1"

[build-dependencies]
imxrt-rt = { version = "0.1", features = ["device"] }

[profile.release]
opt-level = "s"
debug = true
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1
